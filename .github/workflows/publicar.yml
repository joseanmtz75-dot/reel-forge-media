name: Publicar en Instagram

# Los horarios van en UTC, que es lo unico que entiende GitHub.
# Mexico es UTC-6 fijo (sin horario de verano desde 2022), asi que:
#     hora local + 6 = hora UTC
#
# OJO con jueves y domingo: al sumarles 6 horas cruzan la medianoche y caen
# en el DIA SIGUIENTE en UTC. Por eso el dia de la semana del cron no coincide
# con el dia real de publicacion. Es el error clasico de estas configuraciones.
#
#   Dia         Local    UTC      Dia del cron
#   Lunes       12:15    18:15    lunes     (1)
#   Martes      13:30    19:30    martes    (2)
#   Miercoles   12:30    18:30    miercoles (3)
#   Jueves      18:15    00:15    VIERNES   (5)  <- cruza medianoche
#   Viernes     12:15    18:15    viernes   (5)
#   Sabado      10:30    16:30    sabado    (6)
#   Domingo     19:15    01:15    LUNES     (1)  <- cruza medianoche
#
# Ademas hay un RESCATE diario. Hace falta porque el programador de GitHub no
# es fiable: en doce dias hubo retrasos de mas de dos horas y dias en que
# sencillamente no ejecuto, y esas piezas se quedaban muertas en el calendario.
# El rescate publica lo de dias ANTERIORES que nunca salio, de una en una.
# Nunca toca la pieza de hoy: esa tiene su hora elegida y debe salir en su
# ventana, no a cualquier hora.
#
# El programa se guia por la FECHA en Mexico, no por la hora de ejecucion, asi
# que un retraso no le hace publicar la pieza equivocada.

on:
  schedule:
    - cron: "15 18 * * 1"   # lunes 12:15
    - cron: "30 19 * * 2"   # martes 13:30
    - cron: "30 18 * * 3"   # miercoles 12:30
    - cron: "15 0  * * 5"   # jueves 18:15  (viernes en UTC)
    - cron: "15 18 * * 5"   # viernes 12:15
    - cron: "30 16 * * 6"   # sabado 10:30
    - cron: "15 1  * * 1"   # domingo 19:15 (lunes en UTC)
    - cron: "0 3 * * *"     # RESCATE diario, 21:00 hora de Mexico
    - cron: "0 16 * * *"    # RESCATE diario, 10:00 hora de Mexico
  workflow_dispatch:
    inputs:
      forzar_pieza:
        description: "Id de una pieza concreta (dejar vacio para publicar la de hoy)"
        required: false
        default: ""
      modo:
        description: "hoy (la del dia) o atrasadas (rescatar lo que no salio)"
        required: false
        default: "hoy"
        type: choice
        options: ["hoy", "atrasadas"]

# Hace falta escribir porque despues del envio se anota en publicado.json
permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests

      - name: Decidir el modo
        id: modo
        run: |
          # Las dos crones de rescate corren en modo 'atrasadas'; el resto,
          # y el disparo manual, en el modo que se pida.
          if [ "${{ github.event.schedule }}" = "0 3 * * *" ] || \
             [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
            echo "modo=atrasadas" >> $GITHUB_OUTPUT
          else
            echo "modo=${{ github.event.inputs.modo || 'hoy' }}" >> $GITHUB_OUTPUT
          fi

      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORZAR_PIEZA: ${{ github.event.inputs.forzar_pieza }}
          MODO: ${{ steps.modo.outputs.modo }}
        run: python publicar.py

      - name: Anotar lo publicado
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicado.json)" ]; then
            git config user.name  "reel-forge"
            git config user.email "actions@github.com"
            git add publicado.json
            git pull --rebase --quiet || true
            git commit -m "Publicado $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios que anotar."
          fi
